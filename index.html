<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#eadfcb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2b2019" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="產品工作站">
<title>產品工作站</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout: a fixed left rail (navigation + product roster) beside a scrolling work area; on phones the rail becomes a sticky tab strip. */
/* 喵的，又要上班了 look: paper cards with a stitched edge on a warm paper background; walnut at night. */
:root {
  --bg: #e6d8c0; --bg-top: #eadfcb; --bg-bottom: #e1d1b6;
  --panel: #f6eee1; --panel-2: #efe3cf; --field: #fffaf2; --line: rgba(168,132,100,.42); --line-2: #c9b293; --card-line: #8a6a4f; --stitch: rgba(168,132,100,.6);
  --ink: #3b2417; --ink-2: #5b3a29; --muted: #7a5d4a; --title: #4a2a1a;
  --accent: #8a5c3f; --accent-soft: #f8e8cc; --on-accent: #fff7ec; --leather: #6b4a36;
  --grid: rgba(168,132,100,.26); --axis: #b9a284;
  --s1: #2f6fb0; --s2: #d4651e; --s3: #21966b; --s4: #b8860b; --s5: #c45583; --s6: #3f7f1f; --s7: #6a52c4; --s8: #c8473a;
  --good: #3b7536; --warn: #c98a14; --serious: #c96614; --critical: #bb453d;
  --good-ink: #3b7536; --bad-ink: #a83d35;
  --shadow: 0 8px 18px rgba(90,58,38,.1), 0 2px 0 rgba(90,58,38,.12);
  --shadow-float: 0 18px 40px rgba(59,36,23,.28), 0 3px 0 rgba(90,58,38,.18);
  --backdrop: rgba(59,36,23,.38);
  --f-body: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-serif: "Noto Serif TC", "Songti TC", "Source Han Serif TC", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #241a14; --bg-top: #2b2019; --bg-bottom: #1e1611;
    --panel: #35281f; --panel-2: #2a1f18; --field: #211916; --line: rgba(224,186,142,.2); --line-2: #5a4336; --card-line: #7a5c43; --stitch: rgba(224,186,142,.34);
    --ink: #f4e8d6; --ink-2: #e2c9ab; --muted: #b9a593; --title: #f7e1c1;
    --accent: #e0b088; --accent-soft: #4a3624; --on-accent: #2b1d14; --leather: #f0d9b0;
    --grid: rgba(224,186,142,.14); --axis: #6b5140;
    --s1: #4a8ad6; --s2: #d8682a; --s3: #2c9c72; --s4: #bb8318; --s5: #d0628e; --s6: #5f9230; --s7: #8f7ce0; --s8: #de5f52;
    --good: #6fae5c; --warn: #e0a83a; --serious: #e08a4a; --critical: #e0705f;
    --good-ink: #a3d18f; --bad-ink: #f5a090;
    --shadow: 0 8px 18px rgba(0,0,0,.32), 0 2px 0 rgba(0,0,0,.28);
    --shadow-float: 0 18px 40px rgba(0,0,0,.55), 0 3px 0 rgba(0,0,0,.36);
    --backdrop: rgba(8,5,3,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #241a14; --bg-top: #2b2019; --bg-bottom: #1e1611;
  --panel: #35281f; --panel-2: #2a1f18; --field: #211916; --line: rgba(224,186,142,.2); --line-2: #5a4336; --card-line: #7a5c43; --stitch: rgba(224,186,142,.34);
  --ink: #f4e8d6; --ink-2: #e2c9ab; --muted: #b9a593; --title: #f7e1c1;
  --accent: #e0b088; --accent-soft: #4a3624; --on-accent: #2b1d14; --leather: #f0d9b0;
  --grid: rgba(224,186,142,.14); --axis: #6b5140;
  --s1: #4a8ad6; --s2: #d8682a; --s3: #2c9c72; --s4: #bb8318; --s5: #d0628e; --s6: #5f9230; --s7: #8f7ce0; --s8: #de5f52;
  --good: #6fae5c; --warn: #e0a83a; --serious: #e08a4a; --critical: #e0705f;
  --good-ink: #a3d18f; --bad-ink: #f5a090;
  --shadow: 0 8px 18px rgba(0,0,0,.32), 0 2px 0 rgba(0,0,0,.28);
  --shadow-float: 0 18px 40px rgba(0,0,0,.55), 0 3px 0 rgba(0,0,0,.36);
  --backdrop: rgba(8,5,3,.6);
  color-scheme: dark;
}
/* 經典 skin (設定 → 外觀): the original neutral look, kept as an option. */
:root[data-skin="classic"] {
  --bg: #f3f5f7; --bg-top: #f3f5f7; --bg-bottom: #f3f5f7;
  --panel: #ffffff; --panel-2: #edf0f3; --field: #ffffff; --line: #e0e4e9; --line-2: #c8ced7; --card-line: #e0e4e9; --stitch: transparent;
  --ink: #121519; --ink-2: #48515e; --muted: #7b8492; --title: #121519;
  --accent: #1d5bd8; --accent-soft: #e4ecfc; --on-accent: #ffffff; --leather: #121519;
  --grid: #e7eaee; --axis: #c3c9d1;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --good-ink: #006300; --bad-ink: #b42323;
  --shadow: 0 1px 2px rgba(18,21,25,.05), 0 6px 20px rgba(18,21,25,.06);
  --shadow-float: 0 20px 60px rgba(0,0,0,.25);
  --backdrop: rgba(10,12,15,.45);
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-serif: var(--f-body);
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root[data-skin="classic"]:not([data-theme="light"]) {
    --bg: #0e1013; --bg-top: #0e1013; --bg-bottom: #0e1013;
    --panel: #16191e; --panel-2: #1e2229; --field: #16191e; --line: #272c34; --line-2: #3a414c; --card-line: #272c34;
    --ink: #eceff3; --ink-2: #b6bdc8; --muted: #868e9b; --title: #eceff3;
    --accent: #6a9af3; --accent-soft: #1a2740; --on-accent: #0b0d10; --leather: #eceff3;
    --grid: #23272e; --axis: #3a414c;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --critical: #d03b3b;
    --good-ink: #3cc63c; --bad-ink: #f07a7a;
    --shadow: 0 1px 0 rgba(0,0,0,.35);
    --backdrop: rgba(10,12,15,.6);
    color-scheme: dark;
  }
}
:root[data-skin="classic"][data-theme="dark"] {
  --bg: #0e1013; --bg-top: #0e1013; --bg-bottom: #0e1013;
  --panel: #16191e; --panel-2: #1e2229; --field: #16191e; --line: #272c34; --line-2: #3a414c; --card-line: #272c34;
  --ink: #eceff3; --ink-2: #b6bdc8; --muted: #868e9b; --title: #eceff3;
  --accent: #6a9af3; --accent-soft: #1a2740; --on-accent: #0b0d10; --leather: #eceff3;
  --grid: #23272e; --axis: #3a414c;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --good-ink: #3cc63c; --bad-ink: #f07a7a;
  --shadow: 0 1px 0 rgba(0,0,0,.35);
  --backdrop: rgba(10,12,15,.6);
  color-scheme: dark;
}
html, body { height: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
body { background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom)) fixed; background-color: var(--bg-bottom); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.55; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
h1, h2, .card h3, .brand b, .kv, .sheet h2 { font-family: var(--f-serif); font-weight: 900; color: var(--title); }
/* The stitched paper card: a solid brown edge and a dashed seam just inside it. */
.card, .kpis, .live, .ilist, .sbar, .auth-card, .sheet { position: relative; border: 1.25px solid var(--card-line) !important; box-shadow: var(--shadow); }
.card::before, .kpis::before, .live::before, .ilist::before, .sbar::before, .auth-card::before { content: ""; position: absolute; inset: 3.75px; border: 1px dashed var(--stitch); border-radius: calc(var(--r) - 5px); pointer-events: none; z-index: 1; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td.n, .kv, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side {
  position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 20px;
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 14px;
  border-right: 1.25px solid var(--card-line); background: var(--panel);
}
.brand { display: flex; gap: 10px; align-items: center; padding: 0 6px; }
/* Same picture as the home-screen icon (icon.svg), without the stitching: at this size it would only be noise. */
.brand .mark { width: 34px; height: 34px; border-radius: 10px; box-shadow: 0 2px 0 rgba(59,36,23,.25); display: block; flex: none; }
.brand b { display: block; font-size: 15px; letter-spacing: .02em; }
.brand small { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.brand small::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.brand small.ok::before { background: var(--good); }
.brand small.warn::before { background: var(--warn); }
.brand small.err::before { background: var(--critical); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; color: var(--ink-2); text-decoration: none; font-weight: 500; white-space: nowrap; }
.nav a svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.nav a:hover { background: var(--panel-2); color: var(--ink); }
.nav a.on { background: var(--accent-soft); color: var(--title); font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--card-line); }
.nav a em { margin-left: auto; font-style: normal; font-size: 11px; font-family: var(--f-mono); background: var(--panel-2); color: var(--ink-2); border-radius: 99px; padding: 0 7px; }
.nav a em:empty { display: none; }
.nav a.on em { background: var(--panel); }
.roster { display: flex; flex-direction: column; gap: 2px; }
.rh { font-size: 11px; letter-spacing: .08em; color: var(--muted); padding: 0 10px 6px; }
.roster button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 9px; padding: 6px 10px; border-radius: 8px; color: var(--ink-2); font-size: 13px; }
.roster button:hover { background: var(--panel-2); }
.roster button.on { color: var(--ink); font-weight: 500; background: var(--panel-2); }
.roster button:focus-visible { outline: 2px solid var(--accent); }
.roster .addp { color: var(--accent); }
.dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }
.side .foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 0 10px; }

main { min-width: 0; padding-block: 22px 60px; padding-left: 28px; padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
.top { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between; }
.top h1 { font-size: 22px; font-weight: 700; letter-spacing: .01em; }
.top .sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sel { display: flex; align-items: center; gap: 6px; background: var(--field); border: 1px solid var(--line-2); border-radius: 10px; padding: 0 4px 0 10px; height: 34px; }
.sel span { font-size: 12px; color: var(--muted); white-space: nowrap; }
.sel select { border: 0; background: transparent; height: 32px; padding: 0 4px; max-width: 170px; cursor: pointer; }
.sel select:focus-visible { outline: none; }
.sel:focus-within { border-color: var(--accent); }
.seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 4px 11px; border-radius: 6px; cursor: pointer; color: var(--ink-2); font-size: 13px; white-space: nowrap; height: 28px; }
.seg button.on { background: var(--leather); color: var(--on-accent); font-weight: 700; box-shadow: 0 1px 0 rgba(59,36,23,.25); }

/* ---------- surfaces ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; min-width: 0; }
.card > header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; justify-content: space-between; margin-bottom: 14px; }
.card h3 { font-size: 15px; font-weight: 700; }
.card h3 small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 8px; }
.card h4 { font-size: 13px; font-weight: 500; color: var(--ink-2); margin: 16px 0 8px; }
.card.folded > :not(header) { display: none; }
.card.folded > header { margin-bottom: 0; }
.attn-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.attn-list li { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.attn-list li > i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.attn-list li.bad > i { background: var(--critical); }
.attn-list li > span { flex: 1; min-width: 0; }
.attn-list li .btn { flex: none; }
.rev { border-top: 1px solid var(--line); padding: 10px 0; }
.rev:first-child { border-top: 0; padding-top: 0; }
.rev .rh { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 13.5px; }
.rev .rs { color: var(--warn); letter-spacing: 1px; }
.rev.low .rs { color: var(--bad-ink); }
.rev p { margin: 4px 0 0; font-size: 13px; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }
.station { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px dashed var(--stitch, var(--line-2)); border-radius: 12px; background: var(--panel-2); }
.station > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.station small { color: var(--muted); font-size: 12.5px; }
.station .btn { flex: none; text-decoration: none; display: inline-flex; align-items: center; }
.station-wrap { display: flex; flex-direction: column; gap: 8px; }
.sevent { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--panel-2); font-size: 13px; }
.sevent summary { cursor: pointer; font-weight: 600; } .sevent summary small { font-weight: 400; color: var(--muted); margin-left: 8px; }
.sevent p { margin: 8px 0 4px; } .sevent b { display: block; margin-top: 8px; font-size: 12px; color: var(--ink-2); }
.sevent pre { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11.5px; line-height: 1.5; max-height: 220px; overflow: auto; }
.stn-stage { font-weight: 600; color: var(--ink-2); }
.stn-stage.busy, .src-tag.stn.busy { color: var(--accent); } .stn-stage.ok, .src-tag.stn.ok { color: var(--good-ink); } .stn-stage.bad, .src-tag.stn.bad, .station .bad { color: var(--bad-ink); }
.stn-bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 4px; } .stn-bar i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
.stn-report { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.6; color: var(--ink); max-height: 320px; overflow: auto; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); }
.stn-report code { font-family: var(--mono, ui-monospace, monospace); font-size: 12px; background: var(--panel); padding: 0 4px; border-radius: 4px; }
.grid12 { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.span12 { grid-column: span 12; } .span7 { grid-column: span 7; } .span5 { grid-column: span 5; } .span6 { grid-column: span 6; }

.live { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 10px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); font-size: 13px; color: var(--ink-2); }
.live .lt { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; color: var(--ink); }
.live .lt::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 var(--good); animation: livepulse 2s infinite; }
.live b { color: var(--ink); font-variant-numeric: tabular-nums; font-size: 15px; margin-left: 4px; }
.live .la { margin-left: auto; color: var(--muted); font-size: 12px; }
@keyframes livepulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .live .lt::before { animation: none; } }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.kpi { background: var(--panel); padding: 16px 18px 12px; display: grid; grid-template-rows: auto auto auto 1fr; gap: 2px; min-width: 0; }
.kl { font-size: 12.5px; color: var(--ink-2); }
.kv { font-size: 24px; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kd { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: baseline; }
.kd b { font-weight: 500; font-family: var(--f-mono); }
.kd b.good { color: var(--good-ink); } .kd b.bad { color: var(--bad-ink); } .kd b.flat { color: var(--ink-2); }
.spark { width: 100%; height: 30px; display: block; margin-top: 6px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line-2); background: var(--field); border-radius: 99px; padding: 3px 11px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.chip:hover { border-color: var(--line-2); }
.chip.on { background: var(--leather); color: var(--on-accent); border-color: var(--leather); }

.chart { position: relative; width: 100%; min-height: 200px; }
.chart svg { display: block; overflow: visible; touch-action: pan-y; }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.chart .base { stroke: var(--axis); stroke-width: 1; }
.chart text { fill: var(--muted); font-family: var(--f-mono); font-size: 10.5px; }
.chart .ev { stroke: var(--ink-2); stroke-dasharray: 3 3; opacity: .45; }
.chart .evm { fill: var(--ink-2); }
.chart .xh { stroke: var(--line-2); stroke-width: 1; }
.chart .empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 20px; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line-2); box-shadow: var(--shadow); border-radius: 8px; padding: 8px 10px; font-size: 12px; min-width: 160px; max-width: 260px; z-index: 3; }
.tip .tt { font-weight: 500; margin-bottom: 4px; }
.tip .tr { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.tip .tr i, .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.tip .tr span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }

  S.starting = true;
  try {
    me = String(session.user.email || '').toLowerCase();
    const mine = await loadMembers();
    if (!mine) { showAuth('denied'); return; }
    db = { doc: docRef, collection: collRef };
    $('#auth').hidden = true; $('.app').hidden = false;
    $('#me-email').textContent = me;
    S.timer = setTimeout(() => { if (!S.ready) setSync('slow'); }, 10000);

  if (!sb) { showAuth('error'); return; }
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'PASSWORD_RECOVERY') { showAuth('newpw'); return; }
    if (ev === 'SIGNED_OUT') { db = null; me = ''; }

// 當月 / 3 個月 / 12 個月 are calendar months up to today (this month included), compared with the same stretch just

    const endMo = TODAY.slice(0, 7), startMo = addMonths(endMo, -(n - 1));
    const pEndMo = addMonths(endMo, -n);
    const pend = [pEndMo + '-' + TODAY.slice(8), monthEnd(pEndMo)].sort()[0];
    return { start: startMo + '-01', end: TODAY, gran: n === 12 ? 'month' : 'day', pstart: addMonths(startMo, -n) + '-01', pend,
      label: n === 1 ? '較上月同期' : `較前 ${n} 個月` };

    if (m !== 'all' && doc.m !== m) continue;
    if (doc.mo < ms || doc.mo > me) continue;

    if (!d) return;
    if (cfg.area && cfg.series.length === 1 && !gap && pts > 1) g += `<path d="${d}L${lastX.toFixed(1)} ${y(0)}L${firstX.toFixed(1)} ${y(0)}Z" style="fill:${s.color};opacity:.10"/>`;
    g += `<path d="${d}" fill="none" style="stroke:${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (pts === 1 || n <= 14) s.values.forEach((v, i) => { if (v != null) g += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5" style="fill:${s.color}"/>`; });
  });
  host.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.aria || '')}">${g}<g class="hov"></g><rect class="hit" x="${m.l}" y="0" width="${iw}" height="${H}" fill="transparent"/></svg><div class="tip" hidden></div>${any ? '' : `<div class="empty">${cfg.emptyText || '這段期間還沒有數據'}</div>`}`;
  if (!any) return;
  const svg = host.querySelector('svg'), hov = svg.querySelector('.hov'), tip = host.querySelector('.tip');
  const show = ev => {
    const r = svg.getBoundingClientRect();
    let i = n <= 1 ? 0 : Math.round((ev.clientX - r.left - m.l) / (iw / (n - 1)));
    i = Math.max(0, Math.min(n - 1, i));
    const xx = x(i).toFixed(1);
    let s = `<line x1="${xx}" x2="${xx}" y1="${m.t}" y2="${H - m.b}" class="xh"/>`;
    const rows = cfg.series.map(se => ({ name: se.name, color: se.color, v: se.values[i] }));
    rows.forEach(rw => { if (rw.v != null) s += `<circle cx="${xx}" cy="${y(rw.v).toFixed(1)}" r="4.5" style="fill:${rw.color};stroke:var(--panel);stroke-width:2"/>`; });
    hov.innerHTML = s;
    const evs = (cfg.events || []).filter(e => e.i === i);
    tip.innerHTML = `<div class="tt">${esc(cfg.full ? cfg.full[i] : cfg.labels[i])}</div>` +
      rows.sort((a, b) => (b.v ?? -1) - (a.v ?? -1)).slice(0, 9).map(rw => `<div class="tr"><i style="background:${rw.color}"></i><span>${esc(rw.name)}</span><b>${fmtVal(rw.v, cfg.fmt)}</b></div>`).join('') +
      (evs.length ? `<div class="te">${evs.map(e => '◆ ' + esc(e.title)).join('<br>')}</div>` : '');
    tip.hidden = false;
    const tw = tip.offsetWidth;
    let left = +xx + 14; if (left + tw > W) left = +xx - tw - 14; if (left < 0) left = 4;
    tip.style.left = left + 'px'; tip.style.top = m.t + 'px';
  };
  const hide = () => { hov.innerHTML = ''; tip.hidden = true; };
  const hit = svg.querySelector('.hit');
  hit.addEventListener('pointermove', show); hit.addEventListener('pointerdown', show); hit.addEventListener('pointerleave', hide);
}
function spark(values, color) {
  const vs = values.map(v => v == null ? null : v), real = vs.filter(v => v != null);
  if (real.length < 2) return '<svg class="spark" aria-hidden="true"></svg>';
  const W = 200, H = 30, max = Math.max(...real), min = Math.min(0, ...real), n = vs.length;
  const x = i => (i * (W - 4) / (n - 1)) + 2, y = v => H - 3 - (H - 6) * ((v - min) / ((max - min) || 1));
  let d = '', pen = false, li = 0;
  vs.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); pen = true; li = i; });
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" style="stroke:${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/><circle cx="${x(li)}" cy="${y(vs[li])}" r="2.4" style="fill:${color}"/></svg>`;
}
function legendHTML(series) { return series.length < 2 ? '' : `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`; }

/* ================= render: shell ================= */
let pending = false;
function schedule() { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; renderAll(); }); setTimeout(() => { if (pending) { pending = false; renderAll(); } }, 120); }
function sig() { return JSON.stringify([S.ready, canWrite, productsSorted().map(p => [p.id, p.name]), S.cfg]); }
let built = { view: null, sig: null };

function renderAll() {
  const v = UI.view;
  if (UI.product !== 'all' && S.ready && !S.products.has(UI.product)) UI.product = 'all';
  // nav
  $$('.nav a, .more-menu a').forEach(a => a.classList.toggle('on', a.dataset.v === v));
  $('.nav-more').classList.toggle('on', ['data', 'products', 'settings'].includes(v));
  moreMenu(false);
  const openBugs = [...S.issues.values()].filter(i => i.type === 'bug' && isOpen(i.status) && S.products.has(i.product)).length;
  const openFeat = [...S.issues.values()].filter(i => i.type === 'feature' && isOpen(i.status) && S.products.has(i.product)).length;
  $('#nb-bugs').textContent = openBugs || ''; $('#nb-feat').textContent = openFeat || '';
  $('#roster').innerHTML = productsSorted().map(p => `<button data-act="pickproduct" data-id="${p.id}" class="${UI.product === p.id ? 'on' : ''}"><i class="dot" style="background:${SLOT(p.slot || 0)}"></i>${esc(p.name)}${notLive(p) ? '<span class="sample-tag">開發中</span>' : ''}</button>`).join('') || '<div class="hint" style="padding:0 10px">還沒有產品</div>';
  $('.roster .addp').hidden = !canWrite || !db;
  $('#foot').textContent = S.ready && !S.offline ? `${S.products.size} 個產品・${S.cfg.markets.length} 個市場` : '';
  $('#ro').hidden = canWrite || !db;
  // header
  $('#vt').textContent = VIEWS[v][0]; $('#vs').textContent = VIEWS[v][1];
  const gp = $('#g-p');
  gp.innerHTML = `<option value="all">全部產品</option>` + productsSorted().map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  gp.value = UI.product;
  const gm = $('#g-m');
  const extra = new Set(); for (const d of S.metrics.values()) if (d && !S.cfg.markets.some(m => m.code === d.m)) extra.add(d.m);
  gm.innerHTML = `<option value="all">全部市場</option>` + S.cfg.markets.map(m => `<option value="${esc(m.code)}">${esc(m.name)}（${esc(m.code)}）</option>`).join('') + [...extra].map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  gm.value = UI.market; if (gm.value !== UI.market) { UI.market = 'all'; gm.value = 'all'; }
  const showM = v === 'overview' || v === 'data';
  $('#g-m-wrap').hidden = !showM; $('#g-r').hidden = v !== 'overview' && v !== 'churn';
  const weekCancels = [...S.subEvents.values()].filter(e => e.kind === 'cancel' && S.products.has(e.product_id) && Date.now() - new Date(e.event_at) < 7 * 864e5).length;
  $('#nb-churn').textContent = weekCancels || '';
  $('#g-p').closest('.sel').hidden = v === 'settings' || v === 'products';
  $$('#g-r button').forEach(b => b.classList.toggle('on', b.dataset.r === UI.range));
  // view
  const el = $('#view'), s = sig();
  const rebuild = built.view !== v || (built.sig !== s && !(v === 'settings' && el.contains(document.activeElement)));
  if (v === 'overview') renderOverview(el);
  else if (v === 'products') renderProducts(el);
  else if (v === 'churn') renderChurn(el);
  else if (v === 'data') { if (rebuild) buildData(el); updateData(); }
  else if (v === 'bugs' || v === 'features') { if (rebuild) buildIssues(el, v === 'bugs' ? 'bug' : 'feature'); updateIssues(v === 'bugs' ? 'bug' : 'feature'); }
  else if (v === 'settings') { if (rebuild) buildSettings(el); updateSettings(); }
  if (rebuild) built = { view: v, sig: s };
}

function loadingHTML() { return `<div class="card empty-state"><h2>正在載入資料…</h2><p>第一次開啟可能需要幾秒鐘。</p></div>`; }
function onboardingHTML() {
  return `<div class="card empty-state"><h2>從第一個產品開始</h2>
    <p>工作站以「產品」為單位整理所有數據。加入產品之後，就能記錄每天在各市場的下載、訂閱、營收與廣告花費，並追蹤 Bug 和功能需求。</p>
    <ol class="steps"><li>新增產品（App、網站或任何要追蹤的產品）</li><li>到「設定」確認幣別、市場與廣告通路</li><li>在「數據輸入」記錄每日數字，或從 App Store Connect、Google Play、RevenueCat 匯出 CSV 貼上</li></ol>

/* ================= view: overview ================= */
function renderOverview(el) {
  if (!S.ready) { el.innerHTML = loadingHTML(); return; }
  if (!S.products.size) { el.innerHTML = onboardingHTML(); return; }
  const P = period();
  const cur = aggregate({ start: P.start, end: P.end, gran: 'all', groupBy: 'total' }).groups.get('total')?.s[0] || blankCell();
  const prv = aggregate({ start: P.pstart, end: P.pend, gran: 'all', groupBy: 'total' }).groups.get('total')?.s[0] || blankCell();
  const daily = aggregate({ start: P.start, end: P.end, gran: P.gran, groupBy: 'total' });
  const tot = daily.groups.get('total');
  const tiles = ['dl', 'sub', 'act', 'rev', 'ad', 'roas', 'cpi', 'cvr'].map(k => {
    const M = METRICS[k], v = cellVal(cur, k), pv = cellVal(prv, k);
    let delta = '<b class="flat">—</b>';
    if (v != null && pv) {
      const ch = (v - pv) / Math.abs(pv), up = ch >= 0;
      const cls = Math.abs(ch) < 0.005 || M.neutral ? 'flat' : (up !== !!M.lower ? 'good' : 'bad');
      delta = `<b class="${cls}">${up ? '▲' : '▼'} ${Math.abs(ch * 100).toFixed(1)}%</b>`;
    }
    const sv = tot ? tot.s.map(c => cellVal(c, k)) : [];
    return `<div class="kpi"><div class="kl">${M.name}${k === 'act' ? '<span class="hint">（期末）</span>' : ''}</div><div class="kv" title="${esc(fmtVal(v, M.fmt))}">${fmtVal(v, M.fmt)}</div><div class="kd">${delta}<span>${P.label}</span></div>${spark(sv, 'var(--s1)')}</div>`;
  }).join('');

  // trend
  const autoG = UI.product === 'all' ? 'product' : UI.market === 'all' ? 'market' : 'total';
  const gb = UI.group === 'auto' ? autoG : UI.group;
  const tr = aggregate({ start: P.start, end: P.end, gran: P.gran, groupBy: gb });
  let groups = [...tr.groups.values()];
  const totOf = g => g.s.reduce((a, c) => a + (c.rev + c.dl + c.ad), 0);
  groups.sort((a, b) => gb === 'product' ? ((S.products.get(a.key)?.slot ?? 0) - (S.products.get(b.key)?.slot ?? 0)) : gb === 'market' ? mIndex(a.key) - mIndex(b.key) : 0);
  if (groups.length > 8) {
    const keep = [...groups].sort((a, b) => totOf(b) - totOf(a)).slice(0, 7);
    const rest = groups.filter(g => !keep.includes(g));
    const other = { key: '__other', s: tr.B.map((_, i) => rest.reduce((acc, g) => mergeCells(acc, g.s[i]), blankCell())) };
    groups = groups.filter(g => keep.includes(g)).concat(other);
  }
  const series = groups.map(g => ({
    name: g.key === '__other' ? '其他' : gb === 'product' ? pName(g.key) : gb === 'market' ? mName(g.key) : '合計',
    color: g.key === '__other' ? 'var(--muted)' : gb === 'product' ? pColor(g.key) : gb === 'market' ? SLOT(mIndex(g.key)) : 'var(--s1)',
    values: g.s.map(c => cellVal(c, UI.metric))
  }));
  const evs = [...S.events.values()].filter(e => e.date >= P.start && e.date <= P.end && (UI.product === 'all' || !e.product || e.product === 'all' || e.product === UI.product))
    .map(e => ({ i: tr.B.findIndex(b => b.key === (P.gran === 'day' ? e.date : e.date.slice(0, 7))), title: `${e.title}${e.product && e.product !== 'all' && UI.product === 'all' ? '（' + pName(e.product) + '）' : ''}` })).filter(e => e.i >= 0);

  // revenue vs ad
  const ra = tot ? [
    { name: '營收', color: 'var(--s3)', values: tot.s.map(c => cellVal(c, 'rev')) },
    { name: '廣告花費', color: 'var(--s2)', values: tot.s.map(c => cellVal(c, 'ad')) }
  ] : [];

  // channels
  const chs = Object.entries(channelTotals(P.start, P.end)).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  const chTotal = chs.reduce((s, [, v]) => s + v, 0), chMax = chs.length ? chs[0][1] : 1;
  const chHTML = chs.length ? `<div class="bars">${chs.map(([k, v]) => `<div class="bar"><span class="lab" title="${esc(k)}">${esc(k)}</span><div class="trk"><div class="fil" style="width:${(v / chMax * 100).toFixed(1)}%"></div></div><span class="val">${fmtVal(v, 'cur')}<small>${(v / chTotal * 100).toFixed(0)}%</small></span></div>`).join('')}</div>` : '<p class="hint">這段期間沒有廣告花費紀錄。</p>';

  // market table
  const byM = [...aggregate({ start: P.start, end: P.end, gran: 'all', groupBy: 'market' }).groups.values()].map(g => ({ k: g.key, c: g.s[0] })).sort((a, b) => b.c.rev - a.c.rev || b.c.dl - a.c.dl);
  const mRev = byM.reduce((s, r) => s + r.c.rev, 0) || 1;
  const rowCells = c => `<td class="n">${fmtVal(cellVal(c, 'dl'), 'int')}</td><td class="n">${fmtVal(cellVal(c, 'sub'), 'int')}</td><td class="n">${fmtVal(cellVal(c, 'rev'), 'cur')}</td><td class="n">${fmtVal(cellVal(c, 'ad'), 'cur')}</td><td class="n">${fmtVal(cellVal(c, 'cpi'), 'cur2')}</td><td class="n">${fmtVal(cellVal(c, 'roas'), 'x')}</td><td class="n">${fmtVal(cellVal(c, 'cvr'), 'pct')}</td>`;
  const thead = first => `<thead><tr><th>${first}</th><th class="n">下載</th><th class="n">新訂閱</th><th class="n">營收</th><th class="n">廣告花費</th><th class="n">CPI</th><th class="n">ROAS</th><th class="n">轉換率</th></tr></thead>`;
  const mTable = byM.length ? `<div class="tw"><table class="t">${thead('市場')}<tbody>${byM.map(r => `<tr class="click" data-act="pickmarket" data-id="${esc(r.k)}"><td><i class="dot" style="background:${SLOT(mIndex(r.k))}"></i> ${esc(mName(r.k))} <span class="mono hint">${esc(r.k)}</span><span class="share" title="營收佔比"><i style="width:${(r.c.rev / mRev * 100).toFixed(1)}%"></i></span></td>${rowCells(r.c)}</tr>`).join('')}</tbody></table></div>` : '<p class="hint">這段期間沒有數據。</p>';

  let pTable = '';
  if (UI.product === 'all') {
    const byP = [...aggregate({ start: P.start, end: P.end, gran: 'all', groupBy: 'product' }).groups.values()];
    const have = new Set(byP.map(g => g.key));
    // A product still in development with no numbers yet stays out of the table until it has some.
    const waiting = productsSorted().filter(notLive);
    const rows = productsSorted().filter(p => !notLive(p)).map(p => ({ p, c: have.has(p.id) ? byP.find(g => g.key === p.id).s[0] : blankCell() }));
    pTable = `<section class="card span12${foldCls('products')}" id="card-products"><header><h3>各產品成效<small>點選列可只看該產品${waiting.length ? `・還沒上線：${waiting.map(p => esc(p.name)).join('、')}` : ''}</small></h3>${foldBtn('products')}</header><div class="tw"><table class="t">${thead('產品')}<tbody>${rows.map(r => `<tr class="click" data-act="pickproduct" data-id="${r.p.id}"><td><i class="dot" style="background:${SLOT(r.p.slot || 0)}"></i> ${esc(r.p.name)}${r.p.sample ? '<span class="sample-tag">範例</span>' : ''}</td>${rowCells(r.c)}</tr>`).join('')}</tbody></table></div></section>`;
  }

  // issue summary
  const inScope = i => S.products.has(i.product) && (UI.product === 'all' || i.product === UI.product);
  const bugs = [...S.issues.values()].filter(i => i.type === 'bug' && inScope(i));
  const feats = [...S.issues.values()].filter(i => i.type === 'feature' && inScope(i));
  const ob = bugs.filter(i => isOpen(i.status));
  const priCount = PRIORITY.map(([k, l]) => `<span class="stat" data-act="gobugs" data-pri="${k}"><b>${ob.filter(i => i.priority === k).length}</b><span>${k} ${l}</span></span>`).join('');
  const topBugs = ob.sort((a, b) => a.priority.localeCompare(b.priority) || (b.updatedAt || 0) - (a.updatedAt || 0)).slice(0, 5);
  const topFeat = feats.filter(i => isOpen(i.status)).sort((a, b) => (b.votes || 0) - (a.votes || 0)).slice(0, 5);

  const metricChips = Object.entries(METRICS).filter(([k]) => k !== 'cpa').map(([k, M]) => `<button class="chip ${UI.metric === k ? 'on' : ''}" data-act="metric" data-id="${k}">${M.name}</button>`).join('');
  const groupSeg = [['total', '合計'], ['product', '依產品'], ['market', '依市場']].map(([k, l]) => `<button type="button" data-act="group" data-id="${k}" class="${gb === k ? 'on' : ''}">${l}</button>`).join('');
  const roas = cellVal(cur, 'roas');
  const td = aggregate({ start: TODAY, end: TODAY, gran: 'all', groupBy: 'total' }).groups.get('total')?.s[0] || blankCell();
  const liveHTML = lastPush() ? `<div class="live span12" aria-live="off"><span class="lt">今天即時</span>
    <span>下載<b>${fmtVal(cellVal(td, 'dl'), 'int')}</b></span><span>新訂閱<b>${fmtVal(cellVal(td, 'sub'), 'int')}</b></span>
    <span>有效訂閱<b>${fmtVal(cellVal(td, 'act'), 'int')}</b></span><span>營收<b>${fmtVal(cellVal(td, 'rev'), 'cur')}</b></span>
    <span class="la" id="live-at"></span></div>` : '';

  const attn = attentionHTML(attention(P, cur)); // also decides which folded cards open by themselves
  el.innerHTML = `<div class="grid12">
    ${attn}
    ${liveHTML}
    ${subsNowHTML()}
    <div class="kpis span12">${tiles}</div>
    <section class="card span12"><header><h3>成長趨勢<small>${esc(METRICS[UI.metric].name)}・${P.gran === 'day' ? '每日' : '每月'}${evs.length ? '・◆ 為事件標記' : ''}</small></h3><div class="seg">${groupSeg}</div></header>
      <div class="chips" style="margin-bottom:12px">${metricChips}</div>
      ${legendHTML(series)}<div class="chart" id="c-trend"></div></section>
    <section class="card span7"><header><h3>營收與廣告花費<small>ROAS ${fmtVal(roas, 'x')}</small></h3></header>${legendHTML(ra)}<div class="chart" id="c-ra"></div></section>
    <section class="card span5"><header><h3>廣告通路花費<small>合計 ${fmtVal(chTotal, 'cur')}</small></h3></header>${chHTML}</section>
    ${roiHTML(P, cur)}
    ${usageHTML()}
    ${reviewsHTML()}
    <section class="card span12${foldCls('markets')}" id="card-markets"><header><h3>各市場成效<small>點選列可只看該市場</small></h3>${foldBtn('markets')}</header>${mTable}</section>
    ${pTable}
    <section class="card span6"><header><h3>待處理 Bug<small>${ob.length} 筆未結案</small></h3><button class="btn sm" data-act="go" data-id="bugs">全部 Bug</button></header>
      <div class="stat-row" style="margin-bottom:12px">${priCount}</div>
      <div class="mini">${topBugs.map(i => issueRow(i, true)).join('') || '<p class="hint">沒有未結案的 Bug。</p>'}</div></section>
    <section class="card span6"><header><h3>熱門功能需求<small>依提出次數</small></h3><button class="btn sm" data-act="go" data-id="features">全部需求</button></header>
      <div class="mini">${topFeat.map(i => issueRow(i, true)).join('') || '<p class="hint">還沒有功能需求。</p>'}</div></section>
  </div>`;
  const emptyText = `這段期間還沒有數據${canWrite && db ? '<br><button class="btn sm" style="margin-top:10px" data-act="go" data-id="data">前往數據輸入</button>' : ''}`;
  drawLine($('#c-trend'), { labels: tr.B.map(b => b.label), full: tr.B.map(b => b.full), series, fmt: METRICS[UI.metric].fmt, events: evs, area: true, height: 260, aria: '成長趨勢圖', emptyText });
  drawLine($('#c-ra'), { labels: daily.B.map(b => b.label), full: daily.B.map(b => b.full), series: ra, fmt: 'cur', height: 220, aria: '營收與廣告花費', emptyText: '這段期間還沒有數據' });
  USAGE_CHARTS.forEach(c => { const host = document.getElementById(c.id); if (host) drawLine(host, c.cfg); });
}

/* ================= 廣告回本 ================= */
// What the ad money bought in this period, per market that had spend. Meta doesn't say which installs its ads
// brought, so downloads and subscriptions include people who came on their own: these are blended costs, and the
// markets without ads are shown next to them for comparison. Revenue is what users paid (before Apple's cut).
function roiHTML(P, cur) {
  if (!(cur.ad > 0)) return '';
  const byM = [...aggregate({ start: P.start, end: P.end, gran: 'all', groupBy: 'market' }).groups.values()].map(g => ({ k: g.key, c: g.s[0] }));
  const paid = byM.filter(r => r.c.ad > 0).sort((a, b) => b.c.ad - a.c.ad);
  const free = byM.filter(r => !(r.c.ad > 0)).reduce((a, r) => mergeCells(a, r.c), blankCell());
  // Revenue per new subscription: this period's revenue (first payments, yearly plans paid up front, renewals) ÷ new
  // subscriptions. Next to what one cost, it says whether a paying user brings back more than the ads spent on them.
  // 實拿 = after the store's cut (設定 → 商店抽成). Refunded payments are already left out of 營收 by the source.
  const R = roiNet(cur), cpa = R.cpa, perSub = R.perSub;
  const verdict = cpa && perSub ? (perSub >= cpa ? `<b style="color:var(--good-ink)">扣掉商店抽成後，平均每個新付費用戶帶來的錢比找到他的成本多 ${fmtVal(perSub - cpa, 'cur')}</b>` : `<b style="color:var(--bad-ink)">扣掉商店抽成後，平均每個新付費用戶帶來的錢還少於找到他的成本 ${fmtVal(cpa - perSub, 'cur')}</b>`) : '';
  const stat = (v, l) => `<span class="stat"><b>${v}</b><span>${l}</span></span>`;
  const row = (name, c, act) => `<tr${act ? ` class="click" data-act="pickmarket" data-id="${esc(act)}"` : ''}><td>${name}</td><td class="n">${fmtVal(c.ad, 'cur')}</td><td class="n">${fmtVal(cellVal(c, 'dl'), 'int')}</td><td class="n">${fmtVal(cellVal(c, 'sub'), 'int')}</td><td class="n">${fmtVal(cellVal(c, 'cpi'), 'cur2')}</td><td class="n">${fmtVal(cellVal(c, 'cpa'), 'cur')}</td><td class="n">${fmtVal(cellVal(c, 'rev'), 'cur')}</td><td class="n">${fmtVal(cellVal(c, 'roas'), 'x')}</td></tr>`;
  const dash = '<td class="n hint">—</td>';
  const freeRow = free.has && UI.market === 'all' ? `<tr><td class="hint">沒投廣告的市場</td>${dash}<td class="n hint">${fmtVal(free.dl, 'int')}</td><td class="n hint">${fmtVal(free.sub, 'int')}</td>${dash}${dash}<td class="n hint">${fmtVal(free.rev, 'cur')}</td>${dash}</tr>` : '';
  return `<section class="card span12${foldCls('roi')}" id="card-roi"><header><h3>廣告回本<small>這段期間花的廣告費換回了什麼</small></h3>${foldBtn('roi')}</header>
    <div class="stat-row" style="margin-bottom:12px">${stat(fmtVal(cur.ad, 'cur'), '廣告花費')}${stat(fmtVal(cellVal(cur, 'cpi'), 'cur2'), '每次下載成本')}${stat(fmtVal(cpa, 'cur'), '每個新付費用戶成本')}${stat(fmtVal(R.net, 'cur'), `實拿營收（扣 ${R.cutPct}% 抽成）`)}${stat(fmtVal(cur.ad ? R.net / cur.ad : null, 'x'), '實拿營收 ÷ 廣告費')}${stat(fmtVal(perSub, 'cur'), '每個新訂閱實拿')}</div>
    ${verdict ? `<p style="margin:0 0 12px">${verdict}。</p>` : ''}
    <div class="tw"><table class="t"><thead><tr><th>投廣告的市場</th><th class="n">花費</th><th class="n">下載</th><th class="n">新訂閱</th><th class="n">每次下載成本</th><th class="n">每個新付費用戶成本</th><th class="n">營收</th><th class="n">營收 ÷ 廣告費</th></tr></thead>
    <tbody>${paid.map(r => row(`<i class="dot" style="background:${SLOT(mIndex(r.k))}"></i> ${esc(mName(r.k))} <span class="mono hint">${esc(r.k)}</span>`, r.c, r.k)).join('')}${freeRow}</tbody></table></div>
    <p class="hint" style="margin:10px 0 0">Meta 不會告訴我們哪些下載是廣告帶來的，所以下載與新訂閱也包含自己找來的人，成本是「整體平均」；跟沒投廣告的市場比，就看得出廣告多帶來多少。「每個新訂閱實拿」= 期間營收扣掉商店抽成 ${R.cutPct}%（在「設定」可以改）÷ 新訂閱；營收含年費一次付清與續訂，退款的那筆不算。表格裡的營收是用戶付款金額，還沒扣抽成。</p></section>`;
}
function roiNet(c) {
  const cutPct = Math.min(90, Math.max(0, Number(S.cfg.storeCut ?? 15) || 0)), net = c.rev * (1 - cutPct / 100);
  return { cutPct, net, cpa: c.sub && c.ad ? c.ad / c.sub : null, perSub: c.sub ? net / c.sub : null };
}

/* ================= 今天要注意的事 ================= */
// The checks of the LINE 日報 (integrations/alerts/index.ts) on the page: yesterday next to the 7 days before it,
// urgent bugs, low reviews, ads that don't pay back, syncs that stopped. The cards below it that say more are folded
// until an item here points at them (AUTO_OPEN) or the user opens them (UI.fold remembers what they chose).
let AUTO_OPEN = new Set();
const FOLD_DEF = { roi: true, ver: true, ret: true, reviews: true, markets: true, products: true };
const isFolded = k => UI.fold && k in UI.fold ? !!UI.fold[k] : !!FOLD_DEF[k] && !AUTO_OPEN.has(k);
const foldCls = k => isFolded(k) ? ' folded' : '';
const foldBtn = k => `<button type="button" class="btn sm ghost" data-act="fold" data-id="${k}" aria-expanded="${!isFolded(k)}">${isFolded(k) ? '展開 ▾' : '收合 ▴'}</button>`;
const hasData = pid => { for (const d of S.metrics.values()) if (d.p === pid && !d.sample) return true; return false; };
const notLive = p => p.status === 'dev' && !hasData(p.id);
const tpeDay = t => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei' }).format(t);
function attention(P, cur) {
  AUTO_OPEN = new Set();
  const out = [], add = (level, text, o = {}) => { out.push({ level, text, ...o }); if (o.card) AUTO_OPEN.add(o.card); };
  const inScope = pid => S.products.has(pid) && (UI.product === 'all' || UI.product === pid);
  const y = addDays(TODAY, -1), w0 = addDays(TODAY, -8), w1 = addDays(TODAY, -2);
  const tot = (pid, a, b) => aggregate({ start: a, end: b, gran: 'all', groupBy: 'total', p: pid, m: 'all' }).groups.get('total')?.s[0] || blankCell();
  for (const p of productsSorted().filter(p => inScope(p.id) && !p.sample && !notLive(p))) {
    const n = UI.product === 'all' ? `${esc(p.name)}：` : '';
    const c = tot(p.id, y, y), w = tot(p.id, w0, w1), a = { dl: w.dl / 7, sub: w.sub / 7, rev: w.rev / 7, ad: w.ad / 7 };
    if (a.dl >= 20 && c.dl < a.dl * 0.5) add('warn', `${n}昨天下載 ${fmtN(c.dl)}，不到前 7 天平均（${fmtN(Math.round(a.dl))}）的一半`);
    if (a.sub >= 2 && c.sub === 0) add('bad', `${n}昨天一整天沒有新訂閱（前 7 天平均一天 ${a.sub.toFixed(1)} 個）`);
    if (a.rev > 0 && a.sub >= 2 && c.rev < a.rev * 0.3) add('bad', `${n}昨天營收 ${fmtVal(c.rev, 'cur')}，不到前 7 天平均的三成`);
    if (a.ad >= 100 && c.ad > a.ad * 2) add('warn', `${n}昨天廣告費 ${fmtVal(c.ad, 'cur')}，是前 7 天平均的兩倍以上`, { card: 'roi' });
    if (c.ad >= 300 && c.dl < c.ad / 30) add('warn', `${n}昨天廣告有花（${fmtVal(c.ad, 'cur')}）但下載很少，看一下廣告`, { card: 'roi' });
    // 留存: the newest version with enough new installs, next to the version before it.
    const vs = (S.usage.get(p.id)?.vcoh || []).filter(r => r.p === 'ios' && r.n1 >= 50).sort((a, b) => vcmp(a.v, b.v));
    if (vs.length > 1 && vs[0].d1 / vs[0].n1 < vs[1].d1 / vs[1].n1 - 0.03)
      add('warn', `${n}新版 ${esc(vs[0].v)} 的新用戶隔天回來 ${pctText(vs[0].d1, vs[0].n1)}，比 ${esc(vs[1].v)} 的 ${pctText(vs[1].d1, vs[1].n1)} 低`, { card: 'ret' });
    const low = (S.reviews?.products?.[p.id]?.reviews || []).filter(r => r.r <= 2 && Date.now() - r.at < 7 * 864e5).length;
    if (low) add('warn', `${n}最近 7 天有 ${low} 則 1–2 星評論`, { card: 'reviews' });
  }
  const R = roiNet(cur);
  if (R.cpa && R.perSub && R.perSub < R.cpa) add('warn', `目前選的期間廣告還沒回本：每個新付費用戶花 ${fmtVal(R.cpa, 'cur')}，實拿 ${fmtVal(R.perSub, 'cur')}`, { card: 'roi' });
  const bugs = [...S.issues.values()].filter(i => i.type === 'bug' && isOpen(i.status) && inScope(i.product));
  const p0 = bugs.filter(i => i.priority === 'P0').length;
  if (p0) add('bad', `未結案的 Bug 共 ${bugs.length} 個，其中 ${p0} 個是緊急（P0）`, { pri: 'all' });
  for (const i of bugs.filter(i => i.reopened?.at && Date.now() - i.reopened.at < 2 * 864e5)) add('bad', `修好的 Bug 又發生了：${esc(String(i.title).slice(0, 60))}`, { pri: 'all' });
  // Things that quietly stopped.
  for (const [pid, v] of Object.entries(S.sync?.sources || {})) if (inScope(pid) && Date.now() - (+v.at || 0) > 30 * 60000) add('warn', `${esc(pName(pid))} 的數字超過 30 分鐘沒更新，可能不是最新`);
  if (S.sentry && (S.sentry.error || Date.now() - (+S.sentry.at || 0) > 2 * 3600000)) add('warn', `Sentry 錯誤同步停了${S.sentry.error ? `（${esc(SENTRY_ERR[S.sentry.error] || S.sentry.error)}）` : ''}，新的 Bug 不會自動進來`, { go: 'bugs' });
  if (S.metaAds && (S.metaAds.ok === false || Date.now() - (+S.metaAds.at || 0) > 3 * 3600000)) add('warn', 'Meta 廣告費同步停了，廣告花費可能不是最新');
  if (S.alerts && S.alerts.ok === false) add('warn', `LINE 日報與通知送不出去（${esc(S.alerts.error || '')}）`);
  if (S.station?.error && bugs.some(i => i.station && i.station.mode !== 'direct'))
    add('warn', `站長的進度讀不到（${esc(STATION_ERR[S.station.error] || S.station.error)}），交出去的 Bug 會一直停在同一個狀態`, { go: 'settings' });
  return out;
}
function attentionHTML(items) {
  const btn = it => it.card ? `<button type="button" class="btn sm" data-act="showcard" data-id="${it.card}">看明細</button>`
    : it.pri ? `<button type="button" class="btn sm" data-act="gobugs" data-pri="${it.pri}">看 Bug</button>`
    : it.go ? `<button type="button" class="btn sm" data-act="go" data-id="${it.go}">${it.go === 'settings' ? '到設定' : '去看看'}</button>` : '';
  const body = items.length ? `<ul class="attn-list">${items.map(it => `<li class="${it.level}"><i></i><span>${it.text}</span>${btn(it)}</li>`).join('')}</ul>`
    : '<p class="hint">昨天的數字、Bug、評論和各項同步都正常。</p>';
  return `<section class="card span12"><header><h3>今天要注意的事<small>${items.length ? `${items.length} 件` : '沒有'}・跟 LINE 日報同一套檢查</small></h3></header>${body}</section>`;
}

/* ================= App Store 評論 (read hourly by the edge function `alerts`, docs cfg/reviews) ================= */
function reviewsHTML() {
  const star = n => '★'.repeat(n) + '☆'.repeat(Math.max(0, 5 - n));
  return Object.entries(S.reviews?.products || {}).filter(([p, v]) => S.products.has(p) && (UI.product === 'all' || UI.product === p) && ((v.reviews || []).length || v.count)).map(([p, v]) => {
    const rs = (v.reviews || []).filter(r => UI.market === 'all' || r.c === UI.market);

    const head = [v.count ? `台灣商店 ${Number(v.rating || 0).toFixed(1)} ★（${fmtN(v.count)} 個評分）` : '', rs.length ? `最近 ${rs.length} 則${low ? `，其中 ${low} 則 1–2 星` : ''}` : ''].filter(Boolean).join('・');
    return `<section class="card span12${foldCls('reviews')}" id="card-reviews"><header><h3>App Store 評論${UI.product === 'all' ? `・${esc(pName(p))}` : ''}<small>${head}</small></h3>${foldBtn('reviews')}</header>
      ${list || '<p class="hint">這個市場還沒有文字評論。</p>'}
      <p class="hint" style="margin:10px 0 0">Apple 公開的文字評論，每小時更新，涵蓋「設定」裡的每個市場；這裡列最新 8 則。新的 1–2 星評論會推到 LINE。${S.reviews?.at ? `最後更新 ${minsAgo(S.reviews.at)}。` : ''}</p></section>`;
  }).join('');

/* ================= 版本與留存 (pushed hourly by each app, see integrations/usage-meow-work.sql) ================= */
let USAGE_CHARTS = [];
const vcmp = (a, b) => { const x = a.split('.').map(Number), y = b.split('.').map(Number); for (let k = 0; k < Math.max(x.length, y.length); k++) if ((x[k] || 0) !== (y[k] || 0)) return (y[k] || 0) - (x[k] || 0); return 0; };
const pctText = (a, b) => b ? (a / b * 100).toFixed(1) + '%' : '—';
function usageHTML() {
  USAGE_CHARTS = [];
  return [...S.usage.entries()].filter(([p]) => S.products.has(p) && (UI.product === 'all' || UI.product === p)).map(([p, u]) => {
    const name = UI.product === 'all' ? `・${esc(pName(p))}` : '';
    // Versions: share of the iPhones that opened the App each day; the bars use the last full day.
    const ios = (u.versions || []).filter(r => r.p === 'ios');
    const days = [...new Set(ios.map(r => r.d))].sort().slice(-21);
    const dayTot = d => ios.filter(r => r.d === d).reduce((a, r) => a + r.n, 0);
    const full = days.filter(d => d < TODAY).pop() || days[days.length - 1];
    const onFull = ios.filter(r => r.d === full).sort((a, b) => vcmp(a.v, b.v)), fullTot = dayTot(full);
    const store = S.storeVersions?.[p];
    const storeLine = store ? `App Store 現在是 <b>${esc(store.version)}</b>（${dayLabel(new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei' }).format(store.at))} 上架）` : '';
    const todayRows = ios.filter(r => r.d === TODAY), todayTot = todayRows.reduce((a, r) => a + r.n, 0);
    const storeNow = store && todayTot ? `，今天開 App 的 iPhone 有 <b>${pctText(todayRows.find(r => r.v === store.version)?.n || 0, todayTot)}</b> 已經是這版` : '';
    const vMax = Math.max(1, ...onFull.map(r => r.n));
    const bars = onFull.length ? `<div class="bars">${onFull.slice(0, 6).map(r => `<div class="bar"><span class="lab mono">${esc(r.v)}${store?.version === r.v ? ' ★' : ''}</span><div class="trk"><div class="fil" style="width:${(r.n / vMax * 100).toFixed(1)}%"></div></div><span class="val">${pctText(r.n, fullTot)}<small>${fmtN(r.n)} 人</small></span></div>`).join('')}</div>` : '<p class="hint">還沒有 iPhone 的開啟紀錄。</p>';
    const top = [...new Set(ios.filter(r => days.includes(r.d)).map(r => r.v))].sort(vcmp)
      .filter(v => days.some(d => (ios.find(r => r.d === d && r.v === v)?.n || 0) / (dayTot(d) || 1) >= 0.05)).slice(0, 5);
    const id = 'c-ver-' + p.replace(/\W/g, '');
    const series = top.map((v, i) => ({ name: v, color: SLOT(i), values: days.map(d => { const t = dayTot(d); return t ? (ios.find(r => r.d === d && r.v === v)?.n || 0) / t : null; }) }));
    USAGE_CHARTS.push({ id, cfg: { labels: days.map(dayLabel), full: days.map(dayFull), fmt: 'pct', max: 1, height: 200, aria: '各版本使用比例', series } });
    const andr = (u.versions || []).filter(r => r.p === 'android' && r.d === full), andrTot = andr.reduce((a, r) => a + r.n, 0);
    const andrLine = andrTot ? `<p class="hint" style="margin:10px 0 0">Android（${dayLabel(full)}，${fmtN(andrTot)} 人）：${andr.sort((a, b) => b.n - a.n).slice(0, 4).map(r => `${esc(r.v)} ${pctText(r.n, andrTot)}`).join('・')}</p>` : '';
    // Retention: of the installs first opened on a day, how many came back the next day / on day 7 / within the first week.
    const coh = (u.cohorts || []).slice().reverse();
    const avg = k => { const c = coh.filter(r => r[k] != null), n = c.reduce((a, r) => a + r.n, 0); return n ? pctText(c.reduce((a, r) => a + r[k], 0), n) : '—'; };
    const cell = (r, k) => `<td class="n">${r[k] == null ? '<span class="hint">還沒到</span>' : `${pctText(r[k], r.n)}<small class="hint"> ${fmtN(r[k])}</small>`}</td>`;
    const ret = coh.length ? `<div class="tw"><table class="t"><thead><tr><th>第一次開</th><th class="n">新用戶</th><th class="n">隔天回來</th><th class="n">第 7 天</th><th class="n">一週內回來</th></tr></thead>
      <tbody><tr><td><b>平均</b></td><td class="n"><b>${fmtN(coh.reduce((a, r) => a + r.n, 0))}</b></td><td class="n"><b>${avg('d1')}</b></td><td class="n"><b>${avg('d7')}</b></td><td class="n"><b>${avg('w1')}</b></td></tr>
      ${coh.slice(0, 10).map(r => `<tr><td>${dayLabel(r.d)}</td><td class="n">${fmtN(r.n)}</td>${cell(r, 'd1')}${cell(r, 'd7')}${cell(r, 'w1')}</tr>`).join('')}</tbody></table></div>` : '<p class="hint">還沒有足夠的開啟紀錄。</p>';
    // The same, grouped by the version each install first opened (integrations/usage-meow-work.sql, vcoh).
    const vc = (u.vcoh || []).filter(r => r.p === 'ios').sort((a, b) => vcmp(a.v, b.v));
    const vcell = (a, n) => `<td class="n">${n >= 20 ? `${pctText(a, n)}<small class="hint"> ${fmtN(a)}／${fmtN(n)}</small>` : `<span class="hint">${n ? '人數還太少' : '還沒到'}</span>`}</td>`;
    const byVer = vc.length ? `<h4>依第一次開的版本</h4><div class="tw"><table class="t"><thead><tr><th>版本</th><th class="n">新用戶</th><th class="n">隔天回來</th><th class="n">第 7 天</th><th class="n">一週內回來</th></tr></thead>
      <tbody>${vc.map(r => `<tr><td class="mono">${esc(r.v)}${store?.version === r.v ? ' ★' : ''}</td><td class="n">${fmtN(r.n)}</td>${vcell(r.d1, r.n1)}${vcell(r.d7, r.n7)}${vcell(r.w1, r.n7)}</tr>`).join('')}</tbody></table></div>
      <p class="hint" style="margin:8px 0 0">看改版有沒有讓新用戶更願意回來：拿最新兩版互相比。比例後面是「回來的人／已經滿天數的人」。舊版裡混了本來就在用、紀錄開始後才第一次被看到的人，數字會偏高或偏低。</p>` : '';
    const t = u.trial || {};
    const trial = t.started ? `<p class="hint" style="margin:10px 0 0">免費試用：開始 ${fmtN(t.started)}・轉成付費 ${fmtN(t.paid)}（${pctText(t.paid, t.started)}）・試用中 ${fmtN(t.running)}・沒付費就結束 ${fmtN(t.lapsed)}</p>` : '';
    return `<section class="card span6${foldCls('ver')}" id="card-ver"><header><h3>版本使用${name}<small>${full ? dayLabel(full) + ' 開 App 的 iPhone' : ''}</small></h3>${foldBtn('ver')}</header>
        ${storeLine ? `<p class="hint" style="margin:0 0 12px">${storeLine}${storeNow}。★ 是商店上的版本。</p>` : ''}${bars}
        ${series.length > 1 ? `<div style="margin-top:14px">${legendHTML(series)}</div><div class="chart" id="${id}"></div>` : ''}${andrLine}</section>
      <section class="card span6${foldCls('ret')}" id="card-ret"><header><h3>新用戶留存${name}<small>每小時更新・${minsAgo(u.at)}</small></h3>${foldBtn('ret')}</header>${ret}${byVer}${trial}
        <p class="hint" style="margin:10px 0 0">依「第一次開 App」的日子分組。開啟紀錄從 ${esc(u.since ? dayLabel(u.since) : '')} 開始，前 3 天跳過（那時出現的大多是本來就在用的人）。</p></section>`;
  }).join('');
}

  const newOf = plan => snaps.reduce((a, s) => a + (+(s.month_new_plans?.[plan]) || 0), 0);

/* ================= render: cancellations ================= */
const SUBKIND = { cancel: ['關閉自動續訂', 'st-check'], resume: ['重新開啟續訂', 'st-done'], expire: ['到期失效', 'st-off'], refund: ['退款', 'st-active'], billing_fail: ['扣款失敗', 'st-active'] };
const EXPIRE_WHY = { VOLUNTARY: '自己取消', BILLING_RETRY: '扣款失敗', PRICE_INCREASE: '不同意漲價', PRODUCT_NOT_FOR_SALE: '商品下架' };
const planName = p => !p ? '—' : /year|annual/i.test(p) ? '年費' : /month/i.test(p) ? '月費' : /week/i.test(p) ? '週費' : p;
const whenText = s => { const d = new Date(s); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function spanText(ms) {
  if (ms == null || !isFinite(ms) || ms < 0) return '—';
  const m = ms / 60000;
  return m < 60 ? `${Math.max(1, Math.round(m))} 分鐘` : m < 48 * 60 ? `${Math.round(m / 60)} 小時` : `${Math.round(m / 1440)} 天`;
}
function moneyText(obj) {
  const e = Object.entries(obj || {}).filter(([, v]) => +v > 0);
  if (!e.length) return '—';
  return e.map(([c, v]) => { try { const s = nf('m' + c, { style: 'currency', currency: c, maximumFractionDigits: 0 }).format(+v); return c === 'TWD' ? s.replace(/^\$/, 'NT$') : s; } catch (x) { return `${c} ${v}`; } }).join(' + ');
}
function renderChurn(el) {
  if (!S.ready) { el.innerHTML = loadingHTML(); return; }
  const P = period();
  const evs = [...S.subEvents.values()]
    .filter(e => S.products.has(e.product_id) && (UI.product === 'all' || e.product_id === UI.product))
    .filter(e => { const d = iso(new Date(e.event_at)); return d >= P.start && d <= P.end; })
    .sort((a, b) => new Date(b.event_at) - new Date(a.event_at));
  const by = k => evs.filter(e => e.kind === k);
  const cancels = by('cancel');
  // Last day the person's account did anything in the app (from the 訂閱現況 snapshot), and whether that is after this event's day.
  const lastUsed = e => e.account ? S.subs.get(e.product_id)?.last_used?.[e.account] || null : null;
  const usedLater = e => { const d = lastUsed(e); return !!d && d > iso(new Date(e.event_at)); };
  const hasUsage = [...S.subs.values()].some(s => s.last_used);
  const tile =(label, n, note) => `<div class="kpi"><div class="kl">${label}</div><div class="kv">${fmtVal(n, 'int')}</div><div class="kd"><span>${note}</span></div></div>`;
  const trialN = cancels.filter(e => e.trial).length;
  const usingN = new Set(cancels.filter(usedLater).map(e => e.product_id + '/' + e.account)).size;
  const cancelNote = [trialN ? `${trialN} 位在試用期` : '', hasUsage && cancels.length ? `${usingN} 位之後還在用` : ''].filter(Boolean).join('・') || '這一期仍可用到期滿';
  const tiles = tile('關閉自動續訂', cancels.length, cancelNote)
    + tile('到期失效', by('expire').length, '方案到期、沒有續費')
    + tile('退款', by('refund').length, '向 Apple 申請退款')
    + tile('重新開啟續訂', by('resume').length, '關掉後又改回來');

  const timed = cancels.filter(e => e.first_paid_at).map(e => new Date(e.event_at) - new Date(e.first_paid_at));
  const B = [['1 小時內', 36e5], ['1 天內', 864e5], ['1 週內', 7 * 864e5], ['1 個月內', 30 * 864e5], ['更久', Infinity]];
  const counts = B.map(([, lim], i) => timed.filter(ms => ms < lim && (i === 0 || ms >= B[i - 1][1])).length);
  const cMax = Math.max(1, ...counts);
  const sorted = [...timed].sort((a, b) => a - b), median = sorted.length ? sorted[Math.floor((sorted.length - 1) / 2)] : null;
  const dist = timed.length ? `<div class="bars">${B.map(([l], i) => `<div class="bar"><span class="lab">${l}</span><div class="trk"><div class="fil" style="width:${(counts[i] / cMax * 100).toFixed(1)}%"></div></div><span class="val">${counts[i]} 人<small>${(counts[i] / timed.length * 100).toFixed(0)}%</small></span></div>`).join('')}</div>`
    + (timed.length < cancels.length ? `<p class="hint" style="margin-top:10px">另有 ${cancels.length - timed.length} 筆是較早的通知，沒有付費時間。</p>` : '')
    : '<p class="hint">這段期間沒有人關閉自動續訂。</p>';

  const showP = UI.product === 'all';
  const rows = evs.slice(0, 300).map(e => {
    const k = SUBKIND[e.kind] || [e.kind, 'st-open'];
    const why = e.kind === 'expire' && EXPIRE_WHY[e.subtype] ? `<span class="hint">（${EXPIRE_WHY[e.subtype]}）</span>` : '';
    const span = e.first_paid_at ? new Date(e.event_at) - new Date(e.first_paid_at) : null;
    const lu = lastUsed(e);
    const used = !hasUsage ? '' : `<td class="mono">${lu ? `${+lu.slice(5, 7)}/${+lu.slice(8)}${usedLater(e) ? '<span class="sample-tag">之後還在用</span>' : ''}` : '<span class="hint">—</span>'}</td>`;
    return `<tr><td class="mono">${whenText(e.event_at)}</td>${showP ? `<td><i class="dot" style="background:${pColor(e.product_id)}"></i> ${esc(pName(e.product_id))}</td>` : ''}
      <td><span class="pill ${k[1]}">${k[0]}</span>${why}</td>
      <td>${esc(planName(e.plan))}${e.trial ? '<span class="sample-tag">試用期</span>' : ''}</td>
      <td class="mono">${e.first_paid_at ? whenText(e.first_paid_at) : '—'}</td><td class="n">${spanText(span)}</td>
      <td class="n">${moneyText(e.paid_total)}</td><td>${e.market && e.market !== 'OTHER' ? esc(mName(e.market)) : '—'}</td><td class="mono hint">${esc(e.account || '—')}</td>${used}</tr>`;
  }).join('');
  const table = evs.length ? `<div class="tw"><table class="t"><thead><tr><th>時間</th>${showP ? '<th>產品</th>' : ''}<th>事件</th><th>方案</th><th>第一次付費</th><th class="n">付費多久後</th><th class="n">已付金額</th><th>市場</th><th>帳號</th>${hasUsage ? '<th>最後使用</th>' : ''}</tr></thead><tbody>${rows}</tbody></table></div>`
    : '<p class="hint">這段期間沒有退訂、到期或退款。</p>';

  el.innerHTML = `<div class="grid12">
    <div class="kpis span12">${tiles}</div>
    <section class="card span5"><header><h3>付費多久後關閉續訂<small>${median != null ? '中位數 ' + spanText(median) : ''}</small></h3></header>${dist}</section>
    <section class="card span7"><header><h3>怎麼看這些數字</h3></header>
      <p class="hint" style="margin:0 0 8px">「關閉自動續訂」不是退款：這一期的錢已經付了，Pro 會用到期滿，到期那天才會再出現一筆「到期失效」。退款是用戶另外向 Apple 申請的。</p>
      <p class="hint" style="margin:0">「帳號」是 App 內部帳號的代碼，同一個代碼就是同一個人；Apple 不提供姓名或 Email。已付金額是用戶付的價錢，未扣 Apple 抽成。</p>
      ${hasUsage ? '<p class="hint" style="margin:8px 0 0">「最後使用」是這個帳號最後一次在 App 裡留下紀錄的日子（同步資料、備份、AI 助理、語音輸入）；只打開看看、沒改東西不會留紀錄。比退訂那天晚，就標「之後還在用」。刪掉帳號的人追不到，顯示 —。</p>' : ''}</section>
    <section class="card span12"><header><h3>明細<small>${evs.length} 筆${evs.length > 300 ? '・顯示最近 300 筆' : ''}</small></h3></header>${table}</section>
  </div>`;
}

async function deleteProduct(id) {
  for (const [k, d] of [...S.metrics]) if (d?.p === id) await db.doc('metrics/' + k).delete();
  for (const i of [...S.issues.values()]) if (i.product === id) await db.doc('issues/' + i.id).delete();
  for (const e of [...S.events.values()]) if (e.product === id) await db.doc('events/' + e.id).delete();
  await db.doc('products/' + id).delete();
}

/* ----- CSV ----- */
const HMAP = { date: 'date', '日期': 'date', day: 'date', product: 'p', '產品': 'p', app: 'p', market: 'm', '市場': 'm', country: 'm', '國家': 'm', downloads: 'dl', '下載': 'dl', dl: 'dl', installs: 'dl', units: 'dl', new_subs: 'sub', subs: 'sub', sub: 'sub', '新訂閱': 'sub', subscriptions: 'sub', new_subscriptions: 'sub', active_subs: 'act', act: 'act', '有效訂閱': 'act', active_subscriptions: 'act', revenue: 'rev', rev: 'rev', '營收': 'rev', '收入': 'rev', proceeds: 'rev', ad_spend: 'ad', ad: 'ad', spend: 'ad', cost: 'ad', '廣告花費': 'ad', channel: 'ch', '通路': 'ch', source: 'ch' };
let csvState = null;
function splitLine(line, sep) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) { const ch = line[i]; if (ch === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; } else if (ch === sep && !q) { out.push(cur); cur = ''; } else cur += ch; }
  out.push(cur); return out.map(s => s.trim());
}
function normDate(s) { const m = String(s).trim().match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/); return m ? `${m[1]}-${pad(m[2])}-${pad(m[3])}` : null; }
function parseCSV(text, defP, defM) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return { rows: [], errors: ['至少需要一行標題和一行資料'] };
  const sep = lines[0].includes('\t') ? '\t' : ',';
  const head = splitLine(lines[0], sep);
  const cols = head.map(hd => {
    const k = hd.toLowerCase().replace(/\s+/g, '_');
    if (HMAP[k] || HMAP[hd]) return { t: HMAP[k] || HMAP[hd] };
    const ch = S.cfg.channels.find(c => { const ck = c.toLowerCase().replace(/\s+/g, '_'); return ck === k || 'ad_' + ck === k; });
    if (ch) return { t: 'adch', ch };
    return { t: null, hd };
  });
  if (!cols.some(c => c.t === 'date')) return { rows: [], errors: ['找不到日期欄（date 或 日期）'] };
  const byName = new Map(productsSorted().flatMap(p => [[p.name.toLowerCase(), p.id], [p.id.toLowerCase(), p.id]]));
  const rows = [], errors = [], ignored = cols.filter(c => !c.t).map(c => c.hd);
  for (let li = 1; li < lines.length; li++) {
    const cells = splitLine(lines[li], sep), r = { ad: {} };
    let adTotal, ch, pRaw, bad = null;
    cols.forEach((c, i) => {
      const v = cells[i] ?? '';
      switch (c.t) {
        case 'date': r.date = normDate(v); if (!r.date) bad = `日期「${v}」看不懂`; break;
        case 'p': pRaw = v; break;
        case 'm': if (v) r.m = v.toUpperCase(); break;
        case 'dl': case 'sub': case 'act': case 'rev': { const n = num(v); if (n != null) r[c.t] = n; break; }
        case 'ad': adTotal = num(v); break;
        case 'ch': ch = v; break;
        case 'adch': { const n = num(v); if (n != null) r.ad[c.ch] = n; break; }
      }
    });
    if (adTotal != null) { const key = (ch && (S.cfg.channels.find(x => x.toLowerCase() === ch.toLowerCase()) || ch)) || '未分類'; r.ad[key] = (r.ad[key] || 0) + adTotal; }
    r.p = pRaw ? byName.get(pRaw.toLowerCase()) : defP;
    if (pRaw && !r.p) bad = `找不到產品「${pRaw}」`;
    r.m = r.m || defM;
    if (r.date && r.date > TODAY) bad = '日期在未來';
    if (bad) { errors.push(`第 ${li + 1} 行：${bad}`); continue; }
    rows.push(r);
  }
  return { rows, errors, ignored };
}
function csvCheck() {
  const res = parseCSV($('#csv').value, $('#df-p').value, $('#df-m').value);
  csvState = res;
  const out = $('#csv-out');
  if (!res.rows.length) { out.textContent = res.errors.slice(0, 3).join('；') || '沒有可匯入的資料'; $('#csv-go').disabled = true; return; }
  const dates = res.rows.map(r => r.date).sort();
  const combos = new Set(res.rows.map(r => r.p + r.m));
  const newM = [...new Set(res.rows.map(r => r.m))].filter(c => !S.cfg.markets.some(m => m.code === c));
  out.textContent = `可匯入 ${res.rows.length} 筆・${combos.size} 組產品×市場・${dates[0]} ~ ${dates[dates.length - 1]}` +
    (res.errors.length ? `；略過 ${res.errors.length} 行（${res.errors.slice(0, 2).join('；')}）` : '') +
    (res.ignored?.length ? `；忽略欄位：${res.ignored.join('、')}` : '') +
    (newM.length ? `；新市場代碼 ${newM.join('、')}（可到設定補上名稱）` : '');
  $('#csv-go').disabled = false;
}
async function csvImport() {
  if (!csvState?.rows.length) return;
  const groups = new Map();
  for (const r of csvState.rows) { const k = `${r.p}__${r.m}__${r.date.slice(0, 7)}`; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); }
  const btn = $('#csv-go'); btn.disabled = true;
  let n = 0;
  const ok = await W(async () => {
    for (const [, rows] of groups) {
      const { p, m, date } = rows[0];
      await writeDays(p, m, date.slice(0, 7), d => {
        for (const r of rows) {
          const dd = r.date.slice(8), old = d[dd] || {}, merged = Object.assign({}, old);
          ['dl', 'sub', 'act', 'rev'].forEach(k => { if (r[k] != null) merged[k] = r[k]; });
          if (Object.keys(r.ad).length) merged.ad = Object.assign({}, typeof old.ad === 'object' && old.ad ? old.ad : (typeof old.ad === 'number' ? { '未分類': old.ad } : {}), r.ad);
          d[dd] = merged;
        }
      });
      n += rows.length; $('#csv-out').textContent = `匯入中… ${n} / ${csvState.rows.length}`;
    }
  }, `已匯入 ${csvState.rows.length} 筆`);
  if (ok) { $('#csv').value = ''; $('#csv-out').textContent = `完成，匯入 ${n} 筆。`; csvState = null; }
  else btn.disabled = false;
}
async function exportCSV() {
  const r = $('#ex-r').value;
  const start = r === 'all' ? '0000-01-01' : addDays(TODAY, -(+r - 1));
  const chs = new Set(), rows = [];
  for (const doc of S.metrics.values()) {
    if (!doc || !S.products.has(doc.p)) continue;
    if (UI.product !== 'all' && doc.p !== UI.product) continue;
    if (UI.market !== 'all' && doc.m !== UI.market) continue;
    for (const [dd, rec] of Object.entries(doc.d || {})) {
      const date = doc.mo + '-' + dd; if (date < start || date > TODAY) continue;
      const ad = typeof rec.ad === 'number' ? { '未分類': rec.ad } : (rec.ad || {});
      Object.keys(ad).forEach(k => chs.add(k));
      rows.push({ date, p: pName(doc.p), m: doc.m, rec, ad });
    }
  }
  if (!rows.length) { toast('這個範圍沒有數據可匯出', 'err'); return; }
  rows.sort((a, b) => a.date.localeCompare(b.date) || a.p.localeCompare(b.p) || a.m.localeCompare(b.m));
  const cl = [...chs], q = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v;
  const csv = ['date,product,market,downloads,new_subs,active_subs,revenue,ad_spend_total,' + cl.map(q).join(',')]
    .concat(rows.map(x => [x.date, q(x.p), x.m, x.rec.dl ?? '', x.rec.sub ?? '', x.rec.act ?? '', x.rec.rev ?? '', adSum(x.rec.ad) || '', ...cl.map(c => x.ad[c] ?? '')].join(','))).join('\n');
  const name = `product-data-${TODAY}.csv`;
  try {
    const url = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast('已匯出 ' + name);
  } catch (e) {
    const out = $('#ex-out'); out.hidden = false; out.value = csv; out.select();
    toast('無法直接下載，已把 CSV 放在下方文字框，可全選複製');
  }
}
